services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: pipeline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  # App opcional (deploy no VPS). Para desenvolvimento, rode `npm run dev`
  # contra o serviço `db` acima. Suba só o banco com: docker compose up -d db
  app:
    build: .
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://pipeline:pipeline@db:5432/pipeline?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:-dev-secret-troque-isto}"
      AUTH_TRUST_HOST: "true"
      SERVICE_API_KEY: "${SERVICE_API_KEY:-dev-service-key-troque-isto}"
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
